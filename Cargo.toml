[package]
name = "etcher"
version = "0.1.0"
edition = "2021"
authors = ["Leo Choudhary <trackingleo@gmail.com>"]
description = "Write a live ISO to a USB drive, with safety layers to protect other disks"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
eframe = { version = "0.29", features = ["wgpu"] }
egui = "0.29"
egui-wgpu = "0.29"
image = "0.25"
wgpu = "22"
rfd = "0.15"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }
libc = "0.2"

[profile.release]
strip = true
